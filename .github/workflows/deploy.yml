name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frotend
        run: |
          npm ci
          npm run build

      - name: Install Python deps
        run: pip install -r agence/requirements.txt

      - name: Package deployment
        run: |
          tar czf deploy.tar.gz \
            agence/ \
            frotend/dist/ \
            agence/requirements.txt

      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy.tar.gz
          target: /var/www/admin-deploy/

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/admin-deploy
            tar xzf deploy.tar.gz --overwrite

            # Python deps
            source venv/bin/activate
            pip install -q -r agence/requirements.txt

            # Django
            cd agence
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            cd ..

            # Gunicorn restart
            systemctl restart gunicorn

            # Cleanup
            rm deploy.tar.gz

            echo "✅ Deploy complete $(date)"
